<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Viagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Gestão de Viagens</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                      <a class="nav-link" href="clientes.html">Clientes</a>
                   </li>
                  <li class="nav-item">
                      <a class="nav-link" href="viagens.html">Viagens</a>
                  </li>
                  <li class="nav-item">
                      <a class="nav-link" href="reservas.html">Reservas</a>
                  </li>
              </ul>
          </div>
        </div>
      </nav>

  <div class="container">
      <h2>Viagens</h2>

      <div class="row mb-3">
          <div class="col"><input id="destino" class="form-control" placeholder="Destino"></div>
          <div class="col"><input id="horario" class="form-control" placeholder="Data"></div>
          <div class="col"><input id="vagas" type="number" class="form-control" placeholder="Vagas"></div>
          <div class="col">
              <button class="btn btn-success" onclick="criar()">Criar</button>
          </div>
      </div>

      <table class="table">
          <thead><tr><th>ID</th><th>Destino</th><th>Data</th><th>Vagas</th></tr></thead>
          <tbody id="tabela"></tbody>
      </table>
  </div>

  <script>
    const API = "http://localhost:5000";

    async function carregar() {
        const res = await fetch(`${API}/viagens`);
        const data = await res.json();

        tabela.innerHTML = data.map(v =>
            `<tr><td>${v.id}</td><td>${v.destino}</td><td>${v.horario}</td><td>${v.vagas}</td></tr>`
        ).join("");
    }

    async function criar() {
        await fetch(`${API}/viagens`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                destino: destino.value,
                horario: horario.value,
                vagas: parseInt(vagas.value)
            })
        });
        carregar();
    }

    carregar();
  </script>

  </body>
</html>
