<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Viagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="mb-4">✈️ Sistema de Gestão de Viagens</h1>

    <!-- CLIENTES -->
    <div class="card mb-3 p-3">
        <h4>Clientes</h4>
        <div class="row">
            <div class="col">
                <input id="nome" class="form-control" placeholder="Nome">
            </div>
            <div class="col">
                <input id="email" class="form-control" placeholder="Email">
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="criarCliente()">Criar</button>
            </div>
        </div>
    </div>

    <!-- VIAGENS -->
    <div class="card mb-3 p-3">
        <h4>Viagens</h4>
        <div class="row">
            <div class="col">
                <input id="destino" class="form-control" placeholder="Destino">
            </div>
            <div class="col">
                <input id="horario" class="form-control" placeholder="Data">
            </div>
            <div class="col">
                <input id="vagas" type="number" class="form-control" placeholder="Vagas">
            </div>
            <div class="col">
                <button class="btn btn-success" onclick="criarViagem()">Criar</button>
            </div>
        </div>
    </div>

    <!-- RESERVAS -->
    <div class="card mb-3 p-3">
        <h4>Reservas</h4>
        <div class="row">
            <div class="col">
                <select id="clienteSelect" class="form-select"></select>
            </div>
            <div class="col">
                <select id="viagemSelect" class="form-select"></select>
            </div>
            <div class="col">
                <button class="btn btn-warning" onclick="criarReserva()">Reservar</button>
            </div>
        </div>
    </div>

    <!-- TABELAS -->
    <div class="row">
        <div class="col">
            <h5>Clientes</h5>
            <table class="table table-bordered">
                <thead><tr><th>ID</th><th>Nome</th><th>Email</th></tr></thead>
                <tbody id="clientesTabela"></tbody>
            </table>
        </div>

        <div class="col">
            <h5>Viagens</h5>
            <table class="table table-bordered">
                <thead><tr><th>ID</th><th>Destino</th><th>Data</th><th>Vagas</th></tr></thead>
                <tbody id="viagensTabela"></tbody>
            </table>
        </div>
    </div>

    <h5>Reservas</h5>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Viagem</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="reservasTabela"></tbody>
    </table>

</div>

<script>
const API = "http://localhost:5000";

let clientes = [];
let viagens = [];

async function carregarDados() {
    clientes = await (await fetch(`${API}/clientes`)).json();
    viagens = await (await fetch(`${API}/viagens`)).json();
    const reservas = await (await fetch(`${API}/reservas`)).json();

    atualizarSelects();
    atualizarTabelas(clientes, viagens, reservas);
}

function atualizarSelects() {
    clienteSelect.innerHTML = clientes.map(c =>
        `<option value="${c.id}">${c.nome}</option>`
    ).join("");

    viagemSelect.innerHTML = viagens.map(v =>
        `<option value="${v.id}">${v.destino} (${v.vagas} vagas)</option>`
    ).join("");
}

function atualizarTabelas(clientes, viagens, reservas) {
    clientesTabela.innerHTML = clientes.map(c =>
        `<tr><td>${c.id}</td><td>${c.nome}</td><td>${c.email}</td></tr>`
    ).join("");

    viagensTabela.innerHTML = viagens.map(v =>
        `<tr><td>${v.id}</td><td>${v.destino}</td><td>${v.horario}</td><td>${v.vagas}</td></tr>`
    ).join("");

    reservasTabela.innerHTML = reservas.map(r => {
        const cliente = clientes.find(c => c.id === r.cliente_id);
        const viagem = viagens.find(v => v.id === r.viagem_id);

        return `
        <tr>
            <td>${r.id}</td>
            <td>${cliente?.nome || "?"}</td>
            <td>${viagem?.destino || "?"}</td>
            <td>${r.status}</td>
            <td>
                <button class="btn btn-danger btn-sm" onclick="cancelar(${r.id})">
                    Cancelar
                </button>
            </td>
        </tr>`;
    }).join("");
}

async function criarCliente() {
    await fetch(`${API}/clientes`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nome: nome.value, email: email.value })
    });
    carregarDados();
}

async function criarViagem() {
    await fetch(`${API}/viagens`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            destino: destino.value,
            horario: horario.value,
            vagas: parseInt(vagas.value)
        })
    });
    carregarDados();
}

async function criarReserva() {
    const res = await fetch(`${API}/reservas`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            cliente_id: parseInt(clienteSelect.value),
            viagem_id: parseInt(viagemSelect.value)
        })
    });

    const data = await res.json();
    if (data.erro) alert(data.erro);

    carregarDados();
}

async function cancelar(id) {
    await fetch(`${API}/reservas/${id}`, { method: "DELETE" });
    carregarDados();
}

carregarDados();
</script>

</body>
</html>
