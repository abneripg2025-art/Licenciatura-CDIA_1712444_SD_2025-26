<!DOCTYPE html>
<html lang="pt">
    <head>
    <meta charset="UTF-8">
    <title>Sistema de Viagens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
    body {
        background: #f5f7fb;
    }

    .card-modern {
        border: none;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .header {
        font-weight: 600;
        font-size: 1.2rem;
    }

    .badge-vagas {
        font-size: 0.8rem;
    }

    .sidebar {
        height: 100vh;
        background: #111827;
        color: white;
        padding: 20px;
    }

    .sidebar h4 {
        color: #9ca3af;
    }

    .sidebar button {
        width: 100%;
        margin-bottom: 10px;
    }

    .content {
        padding: 30px;
    }

    .card-modern {
    border: none;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: all 0.25s ease;
    }

    .card-modern:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    .card-modern h5 {
        font-weight: 600;
        margin-bottom: 4px;
    }

    .card-modern small {
        font-size: 0.85rem;
    }

    .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
        input, select {
            border-radius: 10px !important;
        }

        button {
            border-radius: 10px !important;
        }

        .card-modern {
            backdrop-filter: blur(6px);
        }

    </style>
    </head>

    <body>

        <div class="d-flex">

            <!-- SIDEBAR -->
            <div class="sidebar">
                <h4>Menu</h4>
                <button class="btn btn-outline-light" onclick="mostrar('clientes')">Clientes</button>
                <button class="btn btn-outline-light" onclick="mostrar('viagens')">Viagens</button>
                <button class="btn btn-outline-light" onclick="mostrar('reservas')">Reservas</button>
            </div>

            <!-- CONTENT -->
            <div class="content flex-fill">

                <!-- CLIENTES -->
                <div id="clientes">
                    <h3 class="mb-3">Clientes</h3>

                    <div class="card-modern p-3 mb-3">
                        <div class="row">
                            <div class="col"><input id="nome" class="form-control" placeholder="Nome"></div>
                            <div class="col"><input id="email" class="form-control" placeholder="Email"></div>
                            <div class="col">
                                <button class="btn btn-primary w-100" onclick="criarCliente()">Criar</button>
                            </div>
                        </div>
                    </div>

                    <div id="clientesLista" class="row"></div>
                </div>

                <!-- VIAGENS -->
                <div id="viagens" style="display:none;">
                    <h3 class="mb-3">Viagens</h3>

                    <div class="card-modern p-3 mb-3">

                        <div class="row g-2">

                            <div class="col-md-2">
                                <input id="codigo_voo" class="form-control" placeholder="Código (TP123)">
                            </div>

                            <div class="col-md-2">
                                <input id="companhia" class="form-control" placeholder="Companhia">
                            </div>

                            <div class="col-md-2">
                                <input id="origem" class="form-control" placeholder="Origem">
                            </div>

                            <div class="col-md-2">
                                <input id="destino" class="form-control" placeholder="Destino">
                            </div>

                            <div class="col-md-2">
                                <input id="data" type="date" class="form-control">
                            </div>

                            <div class="col-md-2">
                                <input id="hora" type="time" class="form-control">
                            </div>

                            <div class="col-md-2">
                                <input id="terminal" class="form-control" placeholder="Terminal">
                            </div>

                            <div class="col-md-2">
                                <input id="portao" class="form-control" placeholder="Portão">
                            </div>

                            <div class="col-md-2">
                                <input id="preco" type="number" class="form-control" placeholder="Preço (€)">
                            </div>

                            <div class="col-md-2">
                                <input id="vagas" type="number" class="form-control" placeholder="Vagas">
                            </div>

                            <div class="col-md-2">
                                <button class="btn btn-success w-100" onclick="criarViagem()">
                                    <i class="bi bi-plus-circle"></i> Criar
                                </button>
                            </div>

                        </div>

                    </div>

                    <div id="viagensLista" class="row"></div>
                </div>

                <!-- RESERVAS -->
                <div id="reservas" style="display:none;">
                    <h3 class="mb-3">Reservas</h3>

                    <div class="card-modern p-3 mb-3">
                        <div class="row">
                            <div class="col">
                                <select id="cliente" class="form-select"></select>
                            </div>
                            <div class="col">
                                <select id="viagem" class="form-select"></select>
                            </div>
                            <div class="col">
                                <button class="btn btn-warning w-100" onclick="criarReserva()">Reservar</button>
                            </div>
                        </div>
                    </div>

                    <div id="reservasLista" class="row"></div>
                </div>

            </div>
        </div>

    <script src="app.js"></script>
        <div class="modal fade" id="modalViagem" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">

              <div class="modal-header">
                <h5 class="modal-title">
                  <i class="bi bi-airplane"></i> Editar Viagem
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">

                <div class="row g-2">

                  <div class="col-md-3">
                    <input id="m_codigo_voo" class="form-control" placeholder="Código">
                  </div>

                  <div class="col-md-3">
                    <input id="m_companhia" class="form-control" placeholder="Companhia">
                  </div>

                  <div class="col-md-3">
                    <input id="m_origem" class="form-control" placeholder="Origem">
                  </div>

                  <div class="col-md-3">
                    <input id="m_destino" class="form-control" placeholder="Destino">
                  </div>

                  <div class="col-md-3">
                    <input id="m_data" type="date" class="form-control">
                  </div>

                  <div class="col-md-3">
                    <input id="m_hora" type="time" class="form-control">
                  </div>

                  <div class="col-md-2">
                    <input id="m_terminal" class="form-control" placeholder="Terminal">
                  </div>

                  <div class="col-md-2">
                    <input id="m_portao" class="form-control" placeholder="Portão">
                  </div>

                  <div class="col-md-2">
                    <input id="m_preco" type="number" class="form-control" placeholder="Preço">
                  </div>

                  <div class="col-md-2">
                    <input id="m_vagas" type="number" class="form-control" placeholder="Vagas">
                  </div>

                </div>

              </div>

              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" onclick="salvarEdicaoViagem()"">
                  <i class="bi bi-check"></i> Salvar
                </button>
              </div>

            </div>
          </div>
        </div>
    </body>
</html>
