<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Viagens</title>
</head>
<body>

<h1>Gestão de Viagens</h1>

<h2>Criar Cliente</h2>
<input id="nome" placeholder="Nome">
<input id="email" placeholder="Email">
<button onclick="criarCliente()">Criar</button>

<h2>Criar Viagem</h2>
<input id="destino" placeholder="Destino">
<input id="horario" placeholder="Horário">
<input id="vagas" placeholder="Vagas" type="number">
<button onclick="criarViagem()">Criar</button>

<h2>Criar Reserva</h2>
<input id="cliente_id" placeholder="ID Cliente" type="number">
<input id="viagem_id" placeholder="ID Viagem" type="number">
<button onclick="criarReserva()">Reservar</button>

<h2>Listar Dados</h2>
<button onclick="listarClientes()">Clientes</button>
<button onclick="listarViagens()">Viagens</button>
<button onclick="listarReservas()">Reservas</button>

<pre id="output"></pre>

<script>
const API = "http://localhost:5000";

async function criarCliente() {
    const res = await fetch(`${API}/clientes`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            nome: document.getElementById("nome").value,
            email: document.getElementById("email").value
        })
    });
    mostrar(res);
}

async function criarViagem() {
    const res = await fetch(`${API}/viagens`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            destino: document.getElementById("destino").value,
            horario: document.getElementById("horario").value,
            vagas: parseInt(document.getElementById("vagas").value)
        })
    });
    mostrar(res);
}

async function criarReserva() {
    const res = await fetch(`${API}/reservas`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            cliente_id: parseInt(document.getElementById("cliente_id").value),
            viagem_id: parseInt(document.getElementById("viagem_id").value)
        })
    });
    mostrar(res);
}

async function listarClientes() {
    const res = await fetch(`${API}/clientes`);
    mostrar(res);
}

async function listarViagens() {
    const res = await fetch(`${API}/viagens`);
    mostrar(res);
}

async function listarReservas() {
    const res = await fetch(`${API}/reservas`);
    mostrar(res);
}

async function mostrar(res) {
    const data = await res.json();
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
