<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Viagens</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            display: flex;
            gap: 40px;
        }
        .box {
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
        }
        input, button {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
        }
        button {
            cursor: pointer;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Criar Cliente</h3>
    <input id="nome" placeholder="Nome">
    <input id="email" placeholder="Email">
    <button onclick="criarCliente()">Criar</button>
    <pre id="clienteOut"></pre>
</div>

<div class="box">
    <h3>Criar Viagem</h3>
    <input id="destino" placeholder="Destino">
    <input id="horario" placeholder="Horário">
    <input id="lugares" placeholder="Lugares">
    <button onclick="criarViagem()">Criar</button>
    <pre id="viagemOut"></pre>
</div>

<div class="box">
    <h3>Criar Reserva</h3>
    <input id="clienteId" placeholder="Cliente ID">
    <input id="viagemId" placeholder="Viagem ID">
    <button onclick="criarReserva()">Reservar</button>
    <pre id="reservaOut"></pre>
</div>

<script>
const CLIENTES_API = "http://localhost:5004";
const VIAGENS_API = "http://localhost:5005";
const RESERVAS_API = "http://localhost:5006";

// CLIENTE
async function criarCliente() {
    const res = await fetch(`${CLIENTES_API}/clientes`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            nome: document.getElementById("nome").value,
            email: document.getElementById("email").value
        })
    });

    const data = await res.json();
    document.getElementById("clienteOut").innerText = JSON.stringify(data, null, 2);
}

// VIAGEM
async function criarViagem() {
    const res = await fetch(`${VIAGENS_API}/viagens`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            destino: document.getElementById("destino").value,
            horario: document.getElementById("horario").value,
            lugares: parseInt(document.getElementById("lugares").value)
        })
    });

    const data = await res.json();
    document.getElementById("viagemOut").innerText = JSON.stringify(data, null, 2);
}

// RESERVA
async function criarReserva() {
    const res = await fetch(`${RESERVAS_API}/reservas`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            cliente_id: document.getElementById("clienteId").value,
            viagem_id: document.getElementById("viagemId").value
        })
    });

    const data = await res.json();
    document.getElementById("reservaOut").innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
